services:
  postgres:
    image: postgres:15
    user: root
    environment:
      POSTGRES_DB: datawarehouse
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ../datasets:/opt/project/datasets:ro
      - ../artifacts:/opt/project/artifacts
      - ../migrations:/opt/project/migrations:ro
      - ../tests:/opt/project/tests:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d datawarehouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow:
    image: apache/airflow:2.8.3
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/datawarehouse
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__PLUGINS_FOLDER: /opt/airflow/plugins
      AIRFLOW__METRICS__STATSD_ON: 'True'
      AIRFLOW__METRICS__STATSD_HOST: prometheus
      AIRFLOW__METRICS__STATSD_PORT: 9125
    volumes:
      - ./dags:/opt/airflow/dags
      - ../datasets:/opt/project/datasets:ro
      - ../artifacts:/opt/project/artifacts
      - ../migrations:/opt/project/migrations:ro
      - ../tests:/opt/project/tests:ro
      - ../config:/opt/project/config:ro
      - ../great_expectations:/opt/project/great_expectations
      - ../requirements.txt:/opt/project/requirements.txt:ro
      - ../scripts:/opt/project/scripts:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    command: bash -c 'pip install -r /opt/project/requirements.txt && chown -R airflow:airflow /opt/project/artifacts && airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com 2>/dev/null; airflow connections add postgres_default --conn-type postgres --conn-login airflow --conn-password airflow --conn-port 5432 --conn-schema datawarehouse 2>/dev/null; airflow webserver --port 8080 & airflow scheduler'
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    depends_on:
      - statsd-exporter

  statsd-exporter:
    image: prom/statsd-exporter:latest
    ports:
      - "9125:9125"
      - "9125:9125/udp"
    command:
      - '--statsd.listen-udp=:9125'
      - '--web.listen-address=:9125'

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres-db-volume:
  grafana-storage: