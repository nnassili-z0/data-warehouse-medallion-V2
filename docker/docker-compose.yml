version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: datawarehouse
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./migrations/postgres:/docker-entrypoint-initdb.d
      - ../datasets:/opt/project/datasets:ro
      - ../artifacts:/opt/project/artifacts
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d datawarehouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow:
    image: apache/airflow:2.8.3
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/datawarehouse
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
      AIRFLOW__CORE__PLUGINS_FOLDER: /opt/project/plugins
      AIRFLOW__CORE__BASE_LOG_FOLDER: /opt/project/logs
    volumes:
      - ./dags:/opt/project/dags
      - ./migrations:/opt/project/migrations:ro
      - ./tests:/opt/project/tests:ro
      - ../datasets:/opt/project/datasets:ro
      - ../artifacts:/opt/project/artifacts
      - airflow-logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true &&
      airflow webserver --port 8080 &
      airflow scheduler
      "
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres-db-volume:
  airflow-logs: