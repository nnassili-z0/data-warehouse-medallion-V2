global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'statsd'
    static_configs:
      - targets: ['statsd-exporter:9125']

  - job_name: 'airflow'
    static_configs:
      - targets: ['airflow:8793']  # If using airflow prometheus exporter